# Production overlay. Use managed Postgres/Redis (provider-agnostic): disable the
# in-cluster instances and point config/secrets at the managed endpoints
# (ideally injected via an external secrets operator, not committed here).
environment: production

postgres:
  enabled: false
redis:
  enabled: false

services:
  api:
    replicas: 3
  web:
    replicas: 3
  # Must stay at 1. The auth service holds refresh-token rotation state in
  # process — a short grace window keyed by the token it just replaced, so a
  # retried or racing refresh is not read as token theft. At two replicas a
  # refresh can land on the pod that knows nothing about the rotation, which
  # revokes every session for that user and logs them out everywhere. Raise this
  # only once that state lives on the session row (see BACKLOG).
  #
  # This number is only worth writing down because auth carries
  # `autoscaling: false` in values.yaml. Without that it would be dead text: an
  # autoscaled service renders no `replicas` at all, and the HPA would have run
  # auth at two to six pods regardless of what this said. CI asserts no auth HPA
  # is rendered, from either values file.
  auth:
    replicas: 1
  calc:
    replicas: 2

ingress:
  host: finance.example.com

# config.REDIS_URL and secrets.DATABASE_URL are expected to be overridden by the
# deployment pipeline / external secrets to reference managed instances. Mail
# and SSO are likewise environment-specific: set secrets.SMTP_URL,
# secrets.OIDC_CLIENT_SECRET and the matching serviceEnv entries there too.
serviceEnv:
  auth:
    PUBLIC_WEB_URL: https://finance.example.com

# Tracing is off until an endpoint exists to send it to; the chart refuses to
# render `enabled: true` with an empty endpoint rather than deploy pods that
# crash on boot. A collector authenticated by a token reads it from the release
# Secret — add OTEL_EXPORTER_OTLP_HEADERS there, not here. At production volume
# set `sampler: parentbased_traceidratio` with a `samplerArg`, and set it for
# every service: a ratio decided twice is a trace sampled in one hop and dropped
# in the next.
tracing:
  enabled: false
  endpoint: ""
