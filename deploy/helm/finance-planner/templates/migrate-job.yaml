{{- if .Values.migrations.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-migrations
  labels:
    {{- include "fp.labels" . | nindent 4 }}
data:
  # Every SQL file under files/ becomes a ConfigMap entry. Files are named
  # 000N_*.sql and applied in lexical order by the Job below — drop in new
  # migrations by adding a file and bumping the prefix.
  {{- range $path, $_ := .Files.Glob "files/*.sql" }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
  {{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate
  labels:
    {{- include "fp.labels" . | nindent 4 }}
  annotations:
    # Run after the (in-cluster) database exists; rerun on every upgrade.
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-db
          image: {{ .Values.migrations.image }}
          command:
            - sh
            - -c
            - 'until pg_isready -d "$DATABASE_URL"; do echo "waiting for db"; sleep 2; done'
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: DATABASE_URL
      containers:
        - name: migrate
          image: {{ .Values.migrations.image }}
          command:
            - sh
            - -c
            - |
              set -e
              for f in $(ls /sql/*.sql | sort); do
                echo "applying $f"
                psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
              done
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: DATABASE_URL
          volumeMounts:
            - name: sql
              mountPath: /sql
      volumes:
        - name: sql
          configMap:
            name: {{ .Release.Name }}-migrations
{{- end }}
