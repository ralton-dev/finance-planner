# Default values. Cloud-agnostic; override per environment with values-*.yaml.
image:
  registry: ghcr.io/ralton-dev/finance-planner
  tag: latest
  pullPolicy: IfNotPresent

# Which deployment this release is. Rendered as `deployment.environment.name` on
# every span (see `tracing` below), so it is the field that tells staging traces
# from production ones in a shared backend. Set it in every overlay.
environment: development

# Application services. Each entry produces a Deployment + Service.
services:
  web:
    port: 8080
    replicas: 1
    health: /
    # web is nginx serving a static bundle: there is no Node process to start an
    # SDK, so tracing variables on it would be dead weight on every pod. Every
    # other entry here is a Node service and traces when `tracing.enabled` is on.
    tracing: false
  api:
    port: 4000
    replicas: 1
    health: /healthz
  auth:
    port: 4001
    replicas: 1
    health: /healthz
    # auth is the one service that is not stateless, so it is the one service
    # the autoscaler must not touch: it holds refresh-token rotation state in
    # process. A second replica turns a retried refresh into an apparent token
    # theft and logs the user out everywhere — see the note in values-prod.yaml.
    # Leave this false until that state lives on the session row (see BACKLOG).
    autoscaling: false
  calc:
    port: 4002
    replicas: 1
    health: /healthz

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Non-secret config shared by services (rendered into a ConfigMap).
config:
  LOG_LEVEL: info
  REDIS_URL: redis://finance-planner-redis:6379
  AUTH_URL: http://finance-planner-auth:4001
  COOKIE_SECURE: "true"

# Non-secret settings only one service needs, layered on top of the shared
# ConfigMap as `env:` on that Deployment. An empty value is omitted entirely
# rather than rendered as "" — the services treat "" as configuration in a
# couple of places, so unset has to mean unset. All optional; defaults are off.
serviceEnv:
  api:
    # From: header for the daily digest. Falls back to a no-reply address.
    MAIL_FROM: ""
    # Daily digest sender. Runs in-process on a 15-minute tick from NOTIFY_HOUR
    # local time. Enable it on exactly one replica — see OPERATIONS.md §3.
    NOTIFY_ENABLED: "false"
    NOTIFY_HOUR: "8"
    # Exposes POST /api/demo/seed. Leave off outside demo installs.
    ENABLE_DEMO_SEED: "false"
    # Exposes GET /api/debug/plan. On, a household member can read the whole
    # household's calculation — see OPERATIONS.md §2.
    ENABLE_PLAN_DEBUG: "false"
  auth:
    # From: header for verification + password-reset mail.
    MAIL_FROM: ""
    # Public origin of the SPA: emailed links and the post-SSO landing spot.
    # Set this to the ingress host once you have a real hostname.
    PUBLIC_WEB_URL: ""
    # OIDC single sign-on. These three plus secrets.OIDC_CLIENT_SECRET must all
    # be set or SSO stays off. The redirect URI must be the *gateway* callback
    # path — https://<ingress.host>/api/auth/oidc/callback — because the
    # handshake cookies are scoped to COOKIE_PATH.
    OIDC_ISSUER: ""
    OIDC_CLIENT_ID: ""
    OIDC_REDIRECT_URI: ""

# Distributed tracing (OpenTelemetry). One switch, because a request that crosses
# a process boundary is still one request: half a fleet exporting spans is a trace
# that stops at the hop, which is the exact defect this exists to show. It is
# therefore set here once rather than per service in `serviceEnv` above — that
# block stays the place for a variable only one service wants.
#
# Off is the default and off means off: with `enabled: false` no OTEL_* variable
# is rendered onto any pod, and the preload in each image loads no SDK at all.
# There is no collector in this chart — point `endpoint` at whichever one you
# already run.
tracing:
  enabled: false
  # A bare origin, no path. The SDK appends /v1/traces to this; the per-signal
  # variable OTEL_EXPORTER_OTLP_TRACES_ENDPOINT is used verbatim instead, so a
  # bare origin there POSTs to / and drops every span in silence. Use this one.
  # e.g. http://opentelemetry-collector.observability:4318
  endpoint: ""
  # Head sampler. Empty leaves the SDK's default (parentbased_always_on), which
  # is what you want until the volume hurts. Then: parentbased_traceidratio with
  # samplerArg "0.1". Set it on all services or the ratio is decided twice.
  sampler: ""
  samplerArg: ""
  # An OTLP endpoint behind auth needs OTEL_EXPORTER_OTLP_HEADERS, which carries a
  # token — so it is not written here. Add an `OTEL_EXPORTER_OTLP_HEADERS` key to
  # `secrets:` below and the traced services pick it up; leave it out and the
  # reference is optional, so the variable is simply unset.

# DB migration Job (Helm pre-install/pre-upgrade hook).
migrations:
  enabled: true
  image: postgres:17-alpine

# Horizontal Pod Autoscaling. Applies to every entry in `services` except those
# carrying `autoscaling: false` — today that is auth, for the reason recorded on
# its entry above. A service the autoscaler owns renders no `replicas` on its
# Deployment, so its `replicas` here applies only when this is disabled; a
# service that has opted out keeps its declared `replicas`.
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

# Secret values (rendered into a Secret). Override in real environments / via
# an external secrets operator — do not commit real secrets.
secrets:
  DATABASE_URL: postgres://finance:finance@finance-planner-postgres:5432/finance
  JWT_SIGNING_KEY: "change-me-in-real-environments"
  # nodemailer transport URL (it carries credentials, hence a Secret). Unset →
  # api and auth log messages instead of sending them.
  SMTP_URL: ""
  # Client secret for the OIDC provider configured in serviceEnv.auth.
  OIDC_CLIENT_SECRET: ""
  # Every key in this map is rendered into the Secret and every key of that Secret
  # reaches every pod, `web` included, through the bulk `secretRef` on each
  # Deployment. That is why OTEL_EXPORTER_OTLP_HEADERS is not listed here with an
  # empty default: unlike serviceEnv, an empty value here is still rendered. Add
  # the key only when you have a value for it:
  #
  #   OTEL_EXPORTER_OTLP_HEADERS: "authorization=Bearer <token>"

# In-cluster Postgres/Redis for non-prod. In prod, disable these and point
# config/secrets at managed instances.
postgres:
  enabled: true
  image: postgres:17-alpine
  user: finance
  password: finance
  database: finance
  storage: 1Gi

redis:
  enabled: true
  image: redis:7-alpine

ingress:
  enabled: true
  className: nginx
  host: finance.local
