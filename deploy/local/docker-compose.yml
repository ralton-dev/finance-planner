# Local development stack. Run from repo root: `make up` (or docker compose ...).
name: finance-planner

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finance}
      POSTGRES_DB: ${POSTGRES_DB:-finance}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Auto-run migrations on first start.
      - ../../db/migrations:/docker-entrypoint-initdb.d:ro
      # Mounted again for `make migrate` / `make seed`.
      - ../../db/migrations:/migrations:ro
      - ../../db/seed:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finance}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      API_PORT: "4000"
      DATABASE_URL: postgres://${POSTGRES_USER:-finance}:${POSTGRES_PASSWORD:-finance}@postgres:5432/${POSTGRES_DB:-finance}
      REDIS_URL: redis://redis:6379
      AUTH_URL: http://auth:4001
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-dev-insecure-secret-change-me}
      # Outbound mail for the daily digest. Unset SMTP_URL → digests are logged.
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # The digest sender runs in this one api container; see .env.example.
      NOTIFY_ENABLED: ${NOTIFY_ENABLED:-false}
      NOTIFY_HOUR: ${NOTIFY_HOUR:-8}
      ENABLE_DEMO_SEED: ${ENABLE_DEMO_SEED:-false}
      ENABLE_PLAN_DEBUG: ${ENABLE_PLAN_DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Tracing. Off unless OTEL_ENABLED=true, and the endpoint defaults to the
      # collector below, which only exists under `make up-otel`. See .env.example.
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_LOG_LEVEL: ${OTEL_LOG_LEVEL:-}
      APP_VERSION: ${APP_VERSION:-dev}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  auth:
    build:
      context: ../..
      dockerfile: apps/auth/Dockerfile
    environment:
      AUTH_PORT: "4001"
      DATABASE_URL: postgres://${POSTGRES_USER:-finance}:${POSTGRES_PASSWORD:-finance}@postgres:5432/${POSTGRES_DB:-finance}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-dev-insecure-secret-change-me}
      # Verification + password-reset mail, and the origin its links point at.
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:8080}
      # OIDC single sign-on. All four must be set or SSO stays off; the redirect
      # URI has to be the gateway path (/api/auth/oidc/callback).
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_LOG_LEVEL: ${OTEL_LOG_LEVEL:-}
      APP_VERSION: ${APP_VERSION:-dev}
    ports:
      - "4001:4001"
    depends_on:
      postgres:
        condition: service_healthy

  calc:
    build:
      context: ../..
      dockerfile: apps/calc/Dockerfile
    # No DATABASE_URL and no REDIS_URL: calc has never opened either. Its one
    # route computes in-process out of packages/domain, and nothing under
    # apps/calc/src reads `databaseUrl`, `createStore` or `createDb`. The two
    # variables were configuration for callers that do not exist. The waits on
    # postgres and redis went with them — they only existed to make those
    # connections safe, and a service that connects to neither has no reason to
    # be held back by either.
    environment:
      CALC_PORT: "4002"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_LOG_LEVEL: ${OTEL_LOG_LEVEL:-}
      APP_VERSION: ${APP_VERSION:-dev}
    ports:
      - "4002:4002"

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    # Compose-only nginx that proxies /api -> api. In Kubernetes the ingress
    # routes /api to the api service, so the image's default config is used.
    volumes:
      - ./web-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      - api

  # Traces, printed. `make up-otel` starts this alongside everything else and
  # `make up` does not — the profile is the whole reason a collector can live in
  # this file without appearing in every dev loop and in the stack-smoke CI job,
  # which runs `up -d --build --wait` over the default profile.
  #
  # This is the first compose profile in the repository. A service with
  # `profiles:` is started only when its profile is named, and — the part worth
  # knowing before you add a second — a service in the default profile may not
  # `depends_on` a profiled one, which is why api, auth and calc name the
  # collector's address in an environment variable and nowhere else. With the
  # collector absent, their exports are refused and dropped; nothing waits on it
  # and nothing fails because of it.
  otel-collector:
    profiles: ["otel"]
    # Pinned, and contrib rather than core because that is the image the OTEL
    # docs point at. Do not move this to `latest`: Docker Hub's recent-tag list
    # for this image is mostly `0.159.0-nightly.*`, which are not releases.
    image: otel/opentelemetry-collector-contrib:0.158.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      # OTLP/HTTP. Published so a service run outside compose can export here
      # too; inside the network the services use http://otel-collector:4318.
      - "4318:4318"

volumes:
  pgdata:
