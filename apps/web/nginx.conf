server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cache hashed static assets aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Self-hosted fonts. Filenames are stable, but the bytes never change for a
    # given release, so treat them like the hashed assets above.
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The service worker must never be served stale, or clients pin themselves
    # to an old build and stop picking up deploys.
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # nginx's bundled mime.types has no .webmanifest entry, so this would
    # otherwise go out as application/octet-stream. Scoped to this one location
    # because a `types` block replaces the inherited map rather than extending it.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # SPA fallback: serve index.html for any unmatched route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
