# GitHub-hosted, independent of Dependabot alerts (including pnpm 12 graph gaps).
# Complete JSON reports are retained; no dependency installation in JS audits.
---
name: Dependency audit
"on":
  schedule:
    - cron: 7 5 * * *
  workflow_dispatch: {}
  pull_request:
    paths:
      - "**/package.json"
      - "**/pnpm-lock.yaml"
      - "**/package-lock.json"
      - "**/npm-shrinkwrap.json"
      - "pnpm-workspace.yaml"
      - ".github/workflows/dependency-audit.yml"
  push:
    branches:
      - main
    paths:
      - "**/package.json"
      - "**/pnpm-lock.yaml"
      - "**/package-lock.json"
      - "**/npm-shrinkwrap.json"
      - "pnpm-workspace.yaml"
      - ".github/workflows/dependency-audit.yml"
permissions:
  contents: read
concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          check-latest: true
          node-version: "26"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: package.json
          run_install: false
          cache: false
      - name: Audit every locked runtime and development dependency
        run: |
          # Read the existing lock only; do not install packages or run lifecycle scripts.
          set +e
          # Unfiltered (--config.audit-config={}), so the retained report is complete; the
          # ignores in pnpm-workspace.yaml are applied below, where they can be checked.
          pnpm audit --json --config.audit-config={} > dependency-audit.json
          native_status=$?
          set -e
          NATIVE_AUDIT_STATUS="$native_status" node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('dependency-audit.json', 'utf8'));
          const counts = report.metadata?.vulnerabilities;
          if (report.error || !counts || !Number.isFinite(counts.high) || !Number.isFinite(counts.critical)) {
            throw new Error('Audit feed failed or returned an unsupported report; inspect the artifact.');
          }
          const status = Number(process.env.NATIVE_AUDIT_STATUS);
          console.log('Complete vulnerability counts:', JSON.stringify(counts));
          if (status > 1 || (status !== 0 && !Object.values(counts).some(value => Number(value) > 0))) {
            throw new Error(`Native audit failed with status ${status}.`);
          }
          // The advisories list must account for every high and critical finding the
          // metadata counts; a report that does not (a format change) fails loudly.
          if (!report.advisories || typeof report.advisories !== 'object') {
            throw new Error('Audit report has no advisories list; inspect the artifact.');
          }
          const block = readFileSync('pnpm-workspace.yaml', 'utf8').match(/^  ignoreGhsas:\n((?:    - .+\n)*)/m);
          const ignored = new Set((block?.[1] ?? '').match(/GHSA(?:-[0-9a-z]{4}){3}/g) ?? []);
          const listed = { high: 0, critical: 0 };
          const open = { high: 0, critical: 0 };
          for (const advisory of Object.values(report.advisories)) {
            if (!(advisory.severity in listed)) continue;
            const findings = advisory.findings?.length ?? 0;
            listed[advisory.severity] += findings;
            if (!ignored.has(advisory.github_advisory_id)) open[advisory.severity] += findings;
          }
          if (listed.high !== counts.high || listed.critical !== counts.critical) {
            throw new Error(`Advisories list ${JSON.stringify(listed)} does not match the counts; inspect the artifact.`);
          }
          console.log('Ignored (pnpm-workspace.yaml auditConfig.ignoreGhsas):', [...ignored].join(', ') || 'none');
          console.log('Open high/critical after ignores:', JSON.stringify(open));
          if (open.high + open.critical > 0) process.exit(1);
          NODE
      - name: Retain complete audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit
          path: dependency-audit.json
          retention-days: 30
          if-no-files-found: error
