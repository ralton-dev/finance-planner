name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (unit + component + integration)
        run: pnpm test

      - name: Coverage (enforce engine thresholds)
        run: pnpm coverage

      - name: Build
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter @finance-planner/web exec playwright install --with-deps chromium

      - name: Run Playwright E2E
        run: pnpm --filter @finance-planner/web test:e2e

  integration:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Integration tests (Testcontainers Postgres)
        run: pnpm --filter @finance-planner/data test:int

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v5
      - name: Lint chart
        run: helm lint deploy/helm/finance-planner
      - name: Render manifests (default + prod values)
        run: |
          helm template fp deploy/helm/finance-planner > /dev/null
          helm template fp deploy/helm/finance-planner \
            -f deploy/helm/finance-planner/values-prod.yaml > /dev/null

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    strategy:
      matrix:
        service: [web, api, auth, calc]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: false
          tags: finance-planner/${{ matrix.service }}:ci
