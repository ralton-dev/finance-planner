name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (unit + component + integration)
        run: pnpm test

      - name: Coverage (enforce engine thresholds)
        run: pnpm coverage

      - name: Build
        run: pnpm build

  # Signs in against a real stack and fails on anything the pages fetch that
  # returns 400 or more. It used to load the login screen and nothing else,
  # which is how 1409e5f — six deleted routes the client still called — went
  # through here green while two pages 404'd on every load.
  #
  # No build step of its own: Playwright's webServer builds the SPA, and the
  # harness (apps/web/e2e/stack.mts) runs the api and auth from source over one
  # shared store, so nothing else needs compiling first.
  e2e:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter @finance-planner/web exec playwright install --with-deps chromium

      - name: Sign in and walk the app (Playwright)
        run: pnpm --filter @finance-planner/web test:e2e

      # A failure here names a URL and a status; the trace says which click led
      # to it. Without the artifact that has to be reproduced locally first.
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  integration:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v6
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Integration tests (Testcontainers Postgres)
        run: pnpm --filter @finance-planner/data test:int

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v5
      - name: Lint chart
        run: helm lint deploy/helm/finance-planner
      # Renders both values files and checks which services get an HPA. auth
      # must never get one: it holds refresh-token rotation state in process, so
      # a second replica reads a retried refresh as token theft (see the note on
      # its entry in values.yaml). Rendering alone asserts nothing about that.
      - name: Render manifests and check which services autoscale
        run: |
          set -euo pipefail
          assert_hpas() {
            label=$1
            shift
            rendered=$(helm template fp deploy/helm/finance-planner "$@")
            # Guard against a vacuous pass: prove auth is in this render at all,
            # so an empty or half-rendered chart fails here rather than quietly
            # matching no HPA and reporting success.
            grep -q '^  name: fp-auth$' <<<"$rendered"
            # Compare the whole set, so an HPA going missing fails as loudly as
            # an auth HPA coming back.
            echo "== $label"
            diff <(printf 'fp-api\nfp-calc\nfp-web\n') \
              <(awk '/^kind: HorizontalPodAutoscaler$/ {f=1; next}
                     f && /^  name: / {print $2; f=0}' <<<"$rendered" | sort)
          }
          assert_hpas "default values"
          assert_hpas "values-prod.yaml" -f deploy/helm/finance-planner/values-prod.yaml
          echo "OK: api, calc and web autoscale; auth does not."

  # Build each architecture on its NATIVE runner — emulated (QEMU) arm64 builds
  # of the vite/esbuild bundles blew past GitHub's 6h job limit. Each leg pushes
  # by digest only; docker-merge then assembles the per-service manifest list.
  # ubuntu-24.04-arm is free for public repos.
  docker:
    needs: build-test
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [web, api, auth, calc]
        platform: [linux/amd64, linux/arm64]
    # arm64 builds run on the in-cluster self-hosted runner (homelab-arm64) ONLY
    # on push-to-main (fork PRs fire pull_request and run the base workflow, so
    # they never select it); arm64 on PRs falls back to GitHub's hosted arm
    # runner; amd64 always uses ubuntu-latest.
    runs-on: ${{ (matrix.platform == 'linux/arm64' && github.event_name == 'push' && github.ref == 'refs/heads/main') && 'homelab-arm64' || (matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest') }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4

      - name: Prepare platform tag
        id: prep
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "pair=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # On PRs this builds (verify-only) without pushing. On main it pushes the
      # single-platform image by digest (no tag yet) for the merge step.
      - name: Build (push by digest on main)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/finance-planner/${{ matrix.service }},push-by-digest=true,name-canonical=true,push=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-from: type=gha,scope=${{ matrix.service }}-${{ steps.prep.outputs.pair }}
          cache-to: type=gha,scope=${{ matrix.service }}-${{ steps.prep.outputs.pair }},mode=max

      - name: Export digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.service }}-${{ steps.prep.outputs.pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Assemble + push the multi-arch manifest list per service from the
  # per-platform digests. Tags: sha-<full-commit-sha> + :latest.
  docker-merge:
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [web, api, auth, calc]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.service }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/finance-planner/${{ matrix.service }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Create + push manifest list
        working-directory: /tmp/digests
        run: |
          # shellcheck disable=SC2046  # intentional split: -t flags + digest refs
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository_owner }}/finance-planner/${{ matrix.service }}@sha256:%s ' *)

      - name: Inspect
        run: |
          docker buildx imagetools inspect \
            ghcr.io/${{ github.repository_owner }}/finance-planner/${{ matrix.service }}:${{ steps.meta.outputs.version }}

  # End-to-end stack smoke: build every image via compose, wait for /healthz
  # on the four services, then tear down. Catches runtime regressions that
  # type/unit tests miss — e.g. an ESM bundler inlining a CJS dep so the
  # binary builds cleanly but explodes on the first import.
  stack-smoke:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v6
      - name: Bring up the full stack
        run: |
          cp .env.example .env
          docker compose -f deploy/local/docker-compose.yml up -d --build --wait
      - name: Health probes (api / auth / calc / web)
        run: |
          set -e
          for port in 4000 4001 4002; do
            for i in $(seq 1 30); do
              if curl -sf "http://localhost:$port/healthz" >/dev/null; then
                echo "✓ :$port healthz"; break
              fi
              if [ "$i" = "30" ]; then echo "✗ :$port never came up"; exit 1; fi
              sleep 2
            done
          done
          curl -sf -o /dev/null -w 'web HTTP %{http_code}\n' http://localhost:8080/
      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f deploy/local/docker-compose.yml logs --tail=200
      - name: Tear down
        if: always()
        run: docker compose -f deploy/local/docker-compose.yml down -v

  # Proves a trace survives the api -> auth process boundary, which is the one
  # thing no in-process test can check and stack-smoke above cannot see. That
  # job probes /healthz on three ports and GET / on web; every span it would
  # produce is a /healthz span, and a /healthz span never crosses a process. A
  # CMD that lost its `--import`, a bundler that swallowed fastify, or an
  # instrumentation that stopped injecting `traceparent` would all leave it
  # entirely green while a trace died at the boundary.
  #
  # Two things this job does deliberately:
  #
  #   - it asserts the join **structurally** — auth's server span naming api's
  #     undici client span as its parent — not a trace id that merely appears
  #     twice. Two processes that each started their own trace can produce the
  #     same id twice by coincidence, and this repository has already been
  #     bitten by exactly that shape: both services independently called the
  #     same request `req-4`. Do not weaken this to a shared-id grep;
  #   - it **prints its whole inventory** before it asserts anything. A job that
  #     asserted over zero spans and reported success is the defect rather than
  #     the fix, and a listener that never fires is this project's signature
  #     failure.
  otel-smoke:
    runs-on: ubuntu-latest
    needs: build-test
    env:
      # Set once, for every step including the teardown. COMPOSE_PROFILES is
      # what stops `down` leaving the collector running — the Makefile has to
      # repeat `--profile otel` on its own down target for want of this.
      COMPOSE_FILE: deploy/local/docker-compose.yml
      COMPOSE_PROFILES: otel
      # Overrides the live `OTEL_ENABLED=false` in .env.example, exactly as
      # `make up-otel` does: compose takes the shell environment over the .env
      # file. Asserted below rather than assumed.
      OTEL_ENABLED: "true"
    steps:
      - uses: actions/checkout@v6

      - name: Bring up the stack with the collector
        run: |
          set -euo pipefail
          cp .env.example .env
          docker compose up -d --build --wait

      - name: Confirm the profile gate opened and tracing is on
        run: |
          set -euo pipefail
          # Without this the job's failure mode is "0 spans", which reads like a
          # broken trace rather than a stack that was never asked to trace.
          docker compose ps --services --filter status=running | sort | tee /tmp/running
          grep -qx otel-collector /tmp/running || { echo "✗ no collector: the otel profile did not open"; exit 1; }
          for svc in api auth; do
            on=$(docker compose config | awk -v s="  $svc:" '$0 == s {f=1} f && /OTEL_ENABLED:/ {gsub(/[" ]/, "", $2); print $2; exit}')
            echo "$svc OTEL_ENABLED=$on"
            [ "$on" = "true" ] || { echo "✗ $svc would not have traced"; exit 1; }
          done

      # `--wait` above reports these services Healthy, and it does not mean
      # what it looks like: none of api, auth, calc or web declares a
      # healthcheck, so "Healthy" there is only "the container is running".
      # Ask the port.
      - name: Wait for api and auth to answer
        run: |
          set -euo pipefail
          for port in 4000 4001; do
            for i in $(seq 1 30); do
              if curl -sf "http://localhost:$port/healthz" >/dev/null; then
                echo "✓ :$port healthz"; break
              fi
              if [ "$i" = "30" ]; then echo "✗ :$port never came up"; exit 1; fi
              sleep 2
            done
          done

      # Two, concurrently. One request proves the header crossed; two prove the
      # trace ids are per-request rather than per-process, which is the whole
      # difference between a trace and a service name.
      - name: Two concurrent logins, crossing api into auth
        run: |
          set -euo pipefail
          login() {
            curl -s -o /dev/null -w '%{http_code}' \
              -X POST http://localhost:4000/api/auth/login \
              -H 'content-type: application/json' \
              -d "{\"email\":\"otel-smoke-$1@example.test\",\"password\":\"not-a-real-password\"}"
          }
          login one >/tmp/code-one & p1=$!
          login two >/tmp/code-two & p2=$!
          wait "$p1"; wait "$p2"
          echo "login A -> HTTP $(cat /tmp/code-one), login B -> HTTP $(cat /tmp/code-two)"
          # 401 is the expected answer: nothing seeds a user here, and an
          # unknown password still travels the whole hop and still queries pg.
          # What matters is that *auth* answered — a 404 would mean the proxy
          # route is gone and a 502 that the hop itself broke.
          for code in $(cat /tmp/code-one) $(cat /tmp/code-two); do
            case "$code" in
              200|401) ;;
              *) echo "✗ auth did not answer: HTTP $code"; exit 1 ;;
            esac
          done

      - name: Read the collector's spans and assert the hop
        run: |
          set -euo pipefail

          # The collector's `debug` exporter at verbosity: detailed, flattened
          # to one line per span. `service.name` comes from the enclosing
          # ResourceSpans block, so this has to be a state machine rather than
          # a grep — which is also why it can tell an api span from an auth one
          # at all.
          flatten() {
            sed -E 's/^[0-9]{4}-[0-9]{2}-[0-9]{2}T[^[:space:]]*[[:space:]]+[a-z]+[[:space:]]+//' | awk '
              function val(s) { sub(/^[^:]*:[ ]?/, "", s); return s }
              function str(s) { s = val(s); sub(/^Str\(/, "", s); sub(/\)$/, "", s); return s }
              function emit() {
                if (have && trace != "")
                  printf "%s\t%s\t%s\t%s\t%s\t%s\t%s\n", svc, trace, id, parent, kind, route, name
                have = 0
              }
              /^ResourceSpans #/                  { emit(); svc = ""; res = 1; att = 0; next }
              /^Resource attributes:/             { res = 1; att = 0; next }
              res && /^ *-> service\.name: Str\(/ { svc = str($0); next }
              /^ScopeSpans #/                     { emit(); res = 0; att = 0; next }
              /^InstrumentationScope /            { emit(); res = 0; att = 0; next }
              /^Span #/                           { emit(); trace = id = parent = kind = route = name = ""; att = 0; have = 1; next }
              have && /^ *Trace ID  *:/           { trace  = val($0); next }
              have && /^ *Parent ID  *:/          { parent = val($0); next }
              have && /^ *ID  *:/                 { id     = val($0); next }
              have && /^ *Name  *:/               { name   = val($0); next }
              have && /^ *Kind  *:/               { kind   = val($0); next }
              /^Attributes:/                      { att = 1; next }
              have && att && /^ *-> http\.route: Str\(/ { route = str($0); next }
              END { emit() }
            '
          }

          # A trace crosses when an auth /auth/login server span names an api
          # client span as its parent. Same trace id on both sides is necessary
          # and not sufficient; this is the edge itself.
          crossings() {
            awk -F'\t' '
              $1 == "api"  && $5 == "Client"                       { client[$2 "/" $3] = 1 }
              $1 == "auth" && $5 == "Server" && $6 == "/auth/login" { srv[$2 "/" $4] = $2 }
              END { for (k in srv) if (k in client) print srv[k] }
            ' "$1" | sort -u
          }

          # Nothing is here for the first five seconds: each service's
          # BatchSpanProcessor holds its first batch for OTEL_BSP_SCHEDULE_DELAY
          # (5000 ms by default, and not settable from here — the compose file
          # passes only the variables it names), and the collector's own batch
          # processor adds 200 ms. Poll, because one early look and one look at
          # a broken trace are the same picture.
          SPANS=/tmp/spans.tsv
          for i in $(seq 1 30); do
            docker compose logs --no-log-prefix otel-collector | flatten >"$SPANS" || true
            found=$(crossings "$SPANS" | wc -l | tr -d ' ')
            echo "  poll $i: $(wc -l <"$SPANS" | tr -d ' ') spans, $found crossing"
            [ "$found" -ge 2 ] && break
            sleep 2
          done

          echo
          echo "--- what this job inspected ---"
          echo "spans:     $(wc -l <"$SPANS" | tr -d ' ')"
          echo "trace ids: $(cut -f2 "$SPANS" | sort -u | wc -l | tr -d ' ')"
          echo "by service and kind:"
          awk -F'\t' '{printf "  %-5s %s\n", $1, $5}' "$SPANS" | sort | uniq -c
          echo "http.route on server spans:"
          awk -F'\t' '$5 == "Server" && $6 != "" {printf "  %-5s %s\n", $1, $6}' "$SPANS" | sort | uniq -c
          echo

          fail=0
          note() { echo "✗ $1"; fail=1; }

          # Assert something was looked at, first and separately, so an empty
          # collector fails as "nothing arrived" rather than as a missing join.
          [ -s "$SPANS" ] || note "the collector printed no spans at all"

          mapfile -t crossed < <(crossings "$SPANS")
          [ "${#crossed[@]}" -ge 2 ] || note "expected 2 traces crossing api -> auth, got ${#crossed[@]}"

          for t in "${crossed[@]}"; do
            echo "trace $t"
            # http.route is what dies first when fastify is not patched: the
            # server span survives as a bare `POST` with no route at all, which
            # destroys grouping in any backend without dropping a single span.
            awk -F'\t' -v t="$t" '$2 == t && $1 == "api" && $5 == "Server" && $6 != "" {n++} END {exit !n}' "$SPANS" ||
              note "trace $t has no api server span carrying http.route"

            # The far side of the boundary, in its own words. This is the line
            # that proves the request entered auth rather than being answered
            # by api, and it is the join the two Pino streams never had.
            for svc in api auth; do
              line=$(docker compose logs --no-log-prefix "$svc" | grep -F "\"trace_id\":\"$t\"" | head -1 || true)
              if [ -n "$line" ]; then echo "  $svc said: $line"; else note "no $svc log line carries trace_id $t"; fi
            done
          done

          [ "$fail" = 0 ] || exit 1
          echo
          echo "OK: ${#crossed[@]} traces crossed api -> auth, route-named, and carried into both Pino streams."

      - name: Dump container logs on failure
        if: failure()
        run: |
          docker compose logs --tail=400 otel-collector
          docker compose logs --tail=200 api auth

      - name: Tear down
        if: always()
        run: docker compose down -v
