name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (unit + component + integration)
        run: pnpm test

      - name: Coverage (enforce engine thresholds)
        run: pnpm coverage

      - name: Build
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter @finance-planner/web exec playwright install --with-deps chromium

      - name: Run Playwright E2E
        run: pnpm --filter @finance-planner/web test:e2e

  integration:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v6
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Integration tests (Testcontainers Postgres)
        run: pnpm --filter @finance-planner/data test:int

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v5
      - name: Lint chart
        run: helm lint deploy/helm/finance-planner
      - name: Render manifests (default + prod values)
        run: |
          helm template fp deploy/helm/finance-planner > /dev/null
          helm template fp deploy/helm/finance-planner \
            -f deploy/helm/finance-planner/values-prod.yaml > /dev/null

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    # On PRs we build but don't push (verify-only). On pushes to main we
    # additionally publish to GHCR tagged with the SHA + :latest.
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [web, api, auth, calc]
    steps:
      - uses: actions/checkout@v6
      # QEMU enables cross-building the arm64 image so the manifest is
      # multi-arch (the homelab cluster's general-workload nodes are arm64 Pis).
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/finance-planner/${{ matrix.service }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  # End-to-end stack smoke: build every image via compose, wait for /healthz
  # on the four services, then tear down. Catches runtime regressions that
  # type/unit tests miss — e.g. an ESM bundler inlining a CJS dep so the
  # binary builds cleanly but explodes on the first import.
  stack-smoke:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v6
      - name: Bring up the full stack
        run: |
          cp .env.example .env
          docker compose -f deploy/local/docker-compose.yml up -d --build --wait
      - name: Health probes (api / auth / calc / web)
        run: |
          set -e
          for port in 4000 4001 4002; do
            for i in $(seq 1 30); do
              if curl -sf "http://localhost:$port/healthz" >/dev/null; then
                echo "✓ :$port healthz"; break
              fi
              if [ "$i" = "30" ]; then echo "✗ :$port never came up"; exit 1; fi
              sleep 2
            done
          done
          curl -sf -o /dev/null -w 'web HTTP %{http_code}\n' http://localhost:8080/
      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f deploy/local/docker-compose.yml logs --tail=200
      - name: Tear down
        if: always()
        run: docker compose -f deploy/local/docker-compose.yml down -v
