name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (unit + component + integration)
        run: pnpm test

      - name: Coverage (enforce engine thresholds)
        run: pnpm coverage

      - name: Build
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter @finance-planner/web exec playwright install --with-deps chromium

      - name: Run Playwright E2E
        run: pnpm --filter @finance-planner/web test:e2e

  integration:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v6
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Integration tests (Testcontainers Postgres)
        run: pnpm --filter @finance-planner/data test:int

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v5
      - name: Lint chart
        run: helm lint deploy/helm/finance-planner
      - name: Render manifests (default + prod values)
        run: |
          helm template fp deploy/helm/finance-planner > /dev/null
          helm template fp deploy/helm/finance-planner \
            -f deploy/helm/finance-planner/values-prod.yaml > /dev/null

  # Build each architecture on its NATIVE runner — emulated (QEMU) arm64 builds
  # of the vite/esbuild bundles blew past GitHub's 6h job limit. Each leg pushes
  # by digest only; docker-merge then assembles the per-service manifest list.
  # ubuntu-24.04-arm is free for public repos.
  docker:
    needs: build-test
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [web, api, auth, calc]
        platform: [linux/amd64, linux/arm64]
    # arm64 builds run on the in-cluster self-hosted runner (homelab-arm64) ONLY
    # on push-to-main (fork PRs fire pull_request and run the base workflow, so
    # they never select it); arm64 on PRs falls back to GitHub's hosted arm
    # runner; amd64 always uses ubuntu-latest.
    runs-on: ${{ (matrix.platform == 'linux/arm64' && github.event_name == 'push' && github.ref == 'refs/heads/main') && 'homelab-arm64' || (matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest') }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4

      - name: Prepare platform tag
        id: prep
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "pair=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # On PRs this builds (verify-only) without pushing. On main it pushes the
      # single-platform image by digest (no tag yet) for the merge step.
      - name: Build (push by digest on main)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/finance-planner/${{ matrix.service }},push-by-digest=true,name-canonical=true,push=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-from: type=gha,scope=${{ matrix.service }}-${{ steps.prep.outputs.pair }}
          cache-to: type=gha,scope=${{ matrix.service }}-${{ steps.prep.outputs.pair }},mode=max

      - name: Export digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.service }}-${{ steps.prep.outputs.pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Assemble + push the multi-arch manifest list per service from the
  # per-platform digests. Tags: sha-<full-commit-sha> + :latest.
  docker-merge:
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [web, api, auth, calc]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.service }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/finance-planner/${{ matrix.service }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Create + push manifest list
        working-directory: /tmp/digests
        run: |
          # shellcheck disable=SC2046  # intentional split: -t flags + digest refs
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository_owner }}/finance-planner/${{ matrix.service }}@sha256:%s ' *)

      - name: Inspect
        run: |
          docker buildx imagetools inspect \
            ghcr.io/${{ github.repository_owner }}/finance-planner/${{ matrix.service }}:${{ steps.meta.outputs.version }}

  # End-to-end stack smoke: build every image via compose, wait for /healthz
  # on the four services, then tear down. Catches runtime regressions that
  # type/unit tests miss — e.g. an ESM bundler inlining a CJS dep so the
  # binary builds cleanly but explodes on the first import.
  stack-smoke:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v6
      - name: Bring up the full stack
        run: |
          cp .env.example .env
          docker compose -f deploy/local/docker-compose.yml up -d --build --wait
      - name: Health probes (api / auth / calc / web)
        run: |
          set -e
          for port in 4000 4001 4002; do
            for i in $(seq 1 30); do
              if curl -sf "http://localhost:$port/healthz" >/dev/null; then
                echo "✓ :$port healthz"; break
              fi
              if [ "$i" = "30" ]; then echo "✗ :$port never came up"; exit 1; fi
              sleep 2
            done
          done
          curl -sf -o /dev/null -w 'web HTTP %{http_code}\n' http://localhost:8080/
      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f deploy/local/docker-compose.yml logs --tail=200
      - name: Tear down
        if: always()
        run: docker compose -f deploy/local/docker-compose.yml down -v
