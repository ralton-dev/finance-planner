# Renovate owns update PRs; routine Dependabot version PRs are disabled.
# Keep GitHub vulnerability alerts enabled. Automatic security PRs are a separate repo setting.
---
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 0
    labels:
      - dependencies
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - ci
  - package-ecosystem: docker
    directory: "/apps/api"
    schedule:
      interval: weekly
    labels:
      - dependencies
      - docker
    open-pull-requests-limit: 0
  - package-ecosystem: docker
    directory: "/apps/auth"
    schedule:
      interval: weekly
    labels:
      - dependencies
      - docker
    open-pull-requests-limit: 0
  - package-ecosystem: docker
    directory: "/apps/calc"
    schedule:
      interval: weekly
    labels:
      - dependencies
      - docker
    open-pull-requests-limit: 0
  - package-ecosystem: docker
    directory: "/apps/web"
    schedule:
      interval: weekly
    labels:
      - dependencies
      - docker
    open-pull-requests-limit: 0
