# Weekly reviewed minor/patch PR groups; majors remain separate.
# Security PR groups require enabled repository alerts and security updates. No automerge.
---
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      opentelemetry-family:
        patterns:
          - "@opentelemetry/*"
        update-types:
          - minor
          - patch
      vitest-family:
        patterns:
          - vitest
          - "@vitest/*"
        update-types:
          - minor
          - patch
      minor-and-patch:
        update-types:
          - minor
          - patch
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: "/apps/api"
    schedule:
      interval: weekly
    labels:
      - dependencies
      - docker
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: "/apps/auth"
    schedule:
      interval: weekly
    labels:
      - dependencies
      - docker
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: "/apps/calc"
    schedule:
      interval: weekly
    labels:
      - dependencies
      - docker
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: "/apps/web"
    schedule:
      interval: weekly
    labels:
      - dependencies
      - docker
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
