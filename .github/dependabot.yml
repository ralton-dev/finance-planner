# Weekly dependency updates for the pnpm workspace + GitHub Actions.
# Vulnerability alerts and security-only updates are configured at the repo
# level (see `gh api repos/.../security_and_analysis`).
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      # Group minor + patch bumps to reduce noise; majors stay individual.
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # @vitejs/plugin-react 6 requires vite ^8; this workspace is on vite 6, so
      # every major Dependabot proposes here fails to load the vite config and
      # cannot be merged. Lift this once vite reaches 8 — see the tracking issue.
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
  - package-ecosystem: docker
    directory: "/apps/api"
    schedule:
      interval: weekly
    labels: ["dependencies", "docker"]
  - package-ecosystem: docker
    directory: "/apps/auth"
    schedule:
      interval: weekly
    labels: ["dependencies", "docker"]
  - package-ecosystem: docker
    directory: "/apps/calc"
    schedule:
      interval: weekly
    labels: ["dependencies", "docker"]
  - package-ecosystem: docker
    directory: "/apps/web"
    schedule:
      interval: weekly
    labels: ["dependencies", "docker"]
